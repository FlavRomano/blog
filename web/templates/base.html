{{define "base"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.FullTitle}}</title>
<meta name="description" content="{{.Description}}">
<link rel="canonical" href="{{.Canonical}}">
{{if .NoIndex}}<meta name="robots" content="noindex">{{end}}
<meta property="og:site_name" content="{{.Site.Name}}">
<meta property="og:title" content="{{.FullTitle}}">
<meta property="og:description" content="{{.Description}}">
<meta property="og:url" content="{{.Canonical}}">
<meta property="og:type" content="{{.OGType}}">
{{if .PublishedTime}}<meta property="article:published_time" content="{{.PublishedTime}}">{{end}}
{{range .Tags}}<meta property="article:tag" content="{{.Name}}">
{{end}}<meta name="twitter:card" content="summary">
<link rel="alternate" type="application/rss+xml" title="{{.Site.Name}} (RSS)" href="/rss.xml">
<link rel="alternate" type="application/atom+xml" title="{{.Site.Name}} (Atom)" href="/atom.xml">
<link rel="stylesheet" href="/static/app.css?v={{.Site.AssetVersion}}">
<link rel="stylesheet" href="/static/chroma.css?v={{.Site.AssetVersion}}">
<script src="/static/theme.js?v={{.Site.AssetVersion}}"></script>
{{if .Site.BeaconToken}}<script defer src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "{{.Site.BeaconToken}}"}'></script>{{end}}
</head>
<body class="min-h-screen bg-white text-stone-800 antialiased dark:bg-stone-950 dark:text-stone-200">
<a href="#main" class="sr-only focus:not-sr-only focus:absolute focus:left-2 focus:top-2 focus:rounded focus:bg-white focus:px-3 focus:py-2 focus:text-stone-900">Skip to content</a>
<header class="mx-auto flex max-w-3xl flex-wrap items-center justify-between gap-4 px-4 py-6">
  <a href="/" class="text-lg font-semibold tracking-tight">{{.Site.Name}}</a>
  <nav aria-label="Main" class="flex items-center gap-5 text-sm">
    {{range .Site.Nav}}<a href="{{.Href}}" class="hover:underline {{if eq .Href $.Nav}}font-semibold underline{{end}}" {{if eq .Href $.Nav}}aria-current="page"{{end}}>{{.Label}}</a>
    {{end}}<button type="button" data-theme-toggle aria-label="Toggle dark mode" class="rounded p-1 hover:bg-stone-100 dark:hover:bg-stone-800">
      <svg aria-hidden="true" viewBox="0 0 24 24" class="h-5 w-5 fill-none stroke-current" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </nav>
</header>
<main id="main" class="mx-auto max-w-3xl px-4 pb-16">
{{template "content" .}}
</main>
<footer class="mx-auto max-w-3xl border-t border-stone-200 px-4 py-8 text-sm text-stone-500 dark:border-stone-800 dark:text-stone-400">
  <p class="flex flex-wrap gap-x-5 gap-y-1">
    <span>&copy; {{.Year}} {{.Site.Author}}</span>
    <a href="/rss.xml" class="hover:underline">RSS</a>
    <a href="/atom.xml" class="hover:underline">Atom</a>
    <a href="/privacy" class="hover:underline">Privacy</a>
  </p>
</footer>
</body>
</html>{{end}}
