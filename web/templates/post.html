{{define "content"}}
{{with .Data}}
<article>
  <header class="mb-8">
    <h1 class="text-3xl font-bold tracking-tight sm:text-4xl">{{.Post.Title}}</h1>
    <p class="mt-2 text-sm text-stone-500 dark:text-stone-400"><time datetime="{{.Post.DateISO}}">{{.Post.DateHuman}}</time> · {{.Post.ReadingTime}} min read</p>
    {{template "tags" .Post.Tags}}
  </header>
  {{if .TOC}}
  <nav aria-label="Table of contents" class="mb-8 rounded-lg border border-stone-200 p-4 text-sm dark:border-stone-800">
    <p class="mb-2 font-semibold">On this page</p>
    <ul class="space-y-1">
    {{range .TOC}}<li {{if eq .Level 3}}class="ml-4"{{end}}><a href="#{{.ID}}" class="hover:underline">{{.Title}}</a></li>
    {{end}}</ul>
  </nav>
  {{end}}
  <div class="prose prose-stone max-w-none dark:prose-invert prose-headings:scroll-mt-4">{{.HTML}}</div>
</article>
{{end}}
{{end}}
